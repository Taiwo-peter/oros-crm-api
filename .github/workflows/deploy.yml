name: Build & Deploy CRM API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SERVICE_NAME: crm-api
  SERVICE_PORT: 5001
  SERVICE_DB: oros_crm

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint check
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SERVICE_NAME: crm-api
        run: python -m pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oros-${{ env.SERVICE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/oros-${{ env.SERVICE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SERVICE_NAME,SERVICE_PORT,SERVICE_DB
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ github.repository_owner }}/oros-${SERVICE_NAME}:latest

            docker stop oros-${SERVICE_NAME} 2>/dev/null || true
            docker rm oros-${SERVICE_NAME} 2>/dev/null || true

            source /opt/oros-platform/.env

            docker run -d \
              --name oros-${SERVICE_NAME} \
              --network oros-net \
              --restart unless-stopped \
              -p ${SERVICE_PORT}:5000 \
              -e SERVICE_NAME=${SERVICE_NAME} \
              -e DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@oros-postgres:5432/${SERVICE_DB} \
              -e REDIS_URL=redis://:${REDIS_PASSWORD}@oros-redis:6379/0 \
              -e KAFKA_BOOTSTRAP_SERVERS=oros-kafka:9092 \
              -e KEYCLOAK_URL=http://oros-keycloak:8080 \
              -e KEYCLOAK_REALM=oros \
              ghcr.io/${{ github.repository_owner }}/oros-${SERVICE_NAME}:latest

            sleep 10
            curl -sf http://localhost:${SERVICE_PORT}/health && echo "CRM API deployed successfully" || echo "Health check failed"
